<?xml version="1.0" encoding="UTF-8"?>
<!-- Mapa 8: Ciudad Verde, ciudad con muchas rocas de fondo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" width="120" height="220"
     shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- suelo verdoso de ciudad -->
  <rect x="0" y="0" width="120" height="220" fill="#8fb87a"/>
  <g fill="#a0c78a"><rect x="20" y="24" width="18" height="10"/><rect x="74" y="60" width="18" height="10"/><rect x="28" y="130" width="18" height="10"/><rect x="80" y="176" width="18" height="10"/></g>
  <g fill="#78a064"><rect x="60" y="40" width="14" height="8"/><rect x="24" y="96" width="14" height="8"/><rect x="88" y="132" width="14" height="8"/></g>
  <!-- edificios de piedra a los lados -->
  <g fill="#8a8f98"><rect x="0" y="0" width="20" height="220"/><rect x="100" y="0" width="20" height="220"/></g>
  <g fill="#b6bcc4"><rect x="4" y="12" width="5" height="5"/><rect x="12" y="12" width="5" height="5"/><rect x="4" y="90" width="5" height="5"/><rect x="104" y="40" width="5" height="5"/><rect x="104" y="120" width="5" height="5"/></g>
  <!-- camino -->
  <g fill="#c9a06a">
    <rect x="50" y="200" width="20" height="20"/><rect x="50" y="170" width="20" height="34"/>
    <rect x="30" y="150" width="40" height="22"/><rect x="30" y="120" width="20" height="34"/>
    <rect x="30" y="104" width="52" height="20"/><rect x="62" y="74" width="20" height="34"/>
    <rect x="40" y="56" width="42" height="20"/><rect x="40" y="26" width="20" height="34"/>
    <rect x="40" y="10" width="34" height="20"/>
  </g>
  <!-- MUCHAS rocas repartidas -->
  <g>
    <rect x="24" y="48" width="12" height="8" fill="#9aa0a8"/><rect x="26" y="46" width="7" height="3" fill="#b6bcc4"/><rect x="24" y="54" width="12" height="2" fill="#7a808a"/>
    <rect x="86" y="40" width="10" height="7" fill="#9aa0a8"/><rect x="88" y="39" width="5" height="2" fill="#b6bcc4"/>
    <rect x="22" y="110" width="14" height="9" fill="#9aa0a8"/><rect x="24" y="108" width="8" height="3" fill="#b6bcc4"/><rect x="22" y="117" width="14" height="2" fill="#7a808a"/>
    <rect x="88" y="100" width="11" height="8" fill="#9aa0a8"/><rect x="90" y="98" width="6" height="3" fill="#b6bcc4"/>
    <rect x="84" y="176" width="13" height="9" fill="#9aa0a8"/><rect x="86" y="174" width="7" height="3" fill="#b6bcc4"/>
    <rect x="24" y="186" width="10" height="7" fill="#9aa0a8"/><rect x="26" y="185" width="5" height="2" fill="#b6bcc4"/>
    <rect x="72" y="128" width="9" height="6" fill="#9aa0a8"/><rect x="74" y="127" width="4" height="2" fill="#b6bcc4"/>
  </g>
</svg>
