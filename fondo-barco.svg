<?xml version="1.0" encoding="UTF-8"?>
<!-- Mapa 4: Silph S.A., cubierta de una fragata (barco) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" width="120" height="220"
     shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- mar alrededor del barco -->
  <rect x="0" y="0" width="120" height="220" fill="#3f85c0"/>
  <g fill="#5fa0d8"><rect x="4" y="30" width="14" height="5"/><rect x="104" y="60" width="12" height="5"/><rect x="6" y="140" width="14" height="5"/><rect x="104" y="180" width="12" height="5"/></g>
  <!-- casco del barco (cubierta de madera) -->
  <g fill="#caa978"><rect x="18" y="0" width="84" height="220"/></g>
  <!-- tablones de la cubierta -->
  <g fill="#b2905f"><rect x="18" y="20" width="84" height="2"/><rect x="18" y="60" width="84" height="2"/><rect x="18" y="100" width="84" height="2"/><rect x="18" y="140" width="84" height="2"/><rect x="18" y="180" width="84" height="2"/></g>
  <!-- barandillas metalicas del barco -->
  <g fill="#8a8f98"><rect x="18" y="0" width="4" height="220"/><rect x="98" y="0" width="4" height="220"/></g>
  <g fill="#b6bcc4"><rect x="18" y="30" width="4" height="4"/><rect x="18" y="90" width="4" height="4"/><rect x="18" y="150" width="4" height="4"/><rect x="98" y="50" width="4" height="4"/><rect x="98" y="120" width="4" height="4"/></g>
  <!-- pasillo metalico (camino) -->
  <g fill="#9aa0a8">
    <rect x="50" y="200" width="20" height="20"/><rect x="50" y="170" width="20" height="34"/>
    <rect x="30" y="150" width="40" height="22"/><rect x="30" y="120" width="20" height="34"/>
    <rect x="30" y="104" width="52" height="20"/><rect x="62" y="74" width="20" height="34"/>
    <rect x="40" y="56" width="42" height="20"/><rect x="40" y="26" width="20" height="34"/>
    <rect x="40" y="10" width="34" height="20"/>
  </g>
  <!-- rejilla del pasillo -->
  <g fill="#7a808a"><rect x="50" y="180" width="20" height="2"/><rect x="30" y="130" width="40" height="2"/><rect x="40" y="44" width="42" height="2"/></g>
  <!-- cajas de carga -->
  <rect x="26" y="66" width="12" height="12" fill="#b5873f"/><rect x="26" y="66" width="12" height="2" fill="#d8a85c"/><rect x="31" y="66" width="2" height="12" fill="#8a6a28"/>
  <rect x="84" y="190" width="12" height="12" fill="#b5873f"/><rect x="84" y="190" width="12" height="2" fill="#d8a85c"/>
  <!-- ojo de buey -->
  <rect x="86" y="40" width="10" height="10" fill="#2d6fa0"/><rect x="88" y="42" width="6" height="6" fill="#6fb6e0"/>
  <rect x="24" y="110" width="10" height="10" fill="#2d6fa0"/><rect x="26" y="112" width="6" height="6" fill="#6fb6e0"/>
</svg>
