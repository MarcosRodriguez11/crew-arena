<?xml version="1.0" encoding="UTF-8"?>
<!-- Mapa 6: Ciudad Fucsia, ciudad calida (tonos rosas/calidos) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" width="120" height="220"
     shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- suelo de ciudad rosado -->
  <rect x="0" y="0" width="120" height="220" fill="#d98a9e"/>
  <g fill="#e49caf"><rect x="20" y="24" width="18" height="10"/><rect x="74" y="60" width="18" height="10"/><rect x="28" y="130" width="18" height="10"/><rect x="80" y="176" width="18" height="10"/></g>
  <g fill="#c56f86"><rect x="60" y="40" width="14" height="8"/><rect x="24" y="96" width="14" height="8"/><rect x="88" y="132" width="14" height="8"/></g>
  <!-- edificios a los lados (tonos calidos) -->
  <g fill="#b85c72"><rect x="0" y="0" width="20" height="220"/><rect x="100" y="0" width="20" height="220"/></g>
  <!-- ventanas iluminadas -->
  <g fill="#ffe08a"><rect x="4" y="12" width="5" height="5"/><rect x="12" y="12" width="5" height="5"/><rect x="4" y="30" width="5" height="5"/><rect x="12" y="30" width="5" height="5"/><rect x="4" y="90" width="5" height="5"/><rect x="12" y="90" width="5" height="5"/><rect x="4" y="160" width="5" height="5"/><rect x="104" y="40" width="5" height="5"/><rect x="112" y="40" width="5" height="5"/><rect x="104" y="120" width="5" height="5"/><rect x="104" y="190" width="5" height="5"/></g>
  <!-- tejados -->
  <g fill="#8a4254"><rect x="0" y="0" width="20" height="6"/><rect x="100" y="0" width="20" height="6"/></g>
  <!-- calle (camino) de adoquin calido -->
  <g fill="#e8b878">
    <rect x="50" y="200" width="20" height="20"/><rect x="50" y="170" width="20" height="34"/>
    <rect x="30" y="150" width="40" height="22"/><rect x="30" y="120" width="20" height="34"/>
    <rect x="30" y="104" width="52" height="20"/><rect x="62" y="74" width="20" height="34"/>
    <rect x="40" y="56" width="42" height="20"/><rect x="40" y="26" width="20" height="34"/>
    <rect x="40" y="10" width="34" height="20"/>
  </g>
  <g fill="#d09a56"><rect x="50" y="184" width="20" height="2"/><rect x="30" y="134" width="40" height="2"/><rect x="40" y="40" width="42" height="2"/></g>
  <!-- farolas calidas -->
  <rect x="26" y="68" width="2" height="12" fill="#6b4a2a"/><rect x="24" y="64" width="6" height="5" fill="#ffd36b"/>
  <rect x="92" y="150" width="2" height="12" fill="#6b4a2a"/><rect x="90" y="146" width="6" height="5" fill="#ffd36b"/>
  <!-- plantas en maceta -->
  <rect x="86" y="96" width="8" height="6" fill="#3f9b4a"/><rect x="86" y="102" width="8" height="4" fill="#9a6a3a"/>
</svg>
