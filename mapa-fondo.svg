<?xml version="1.0" encoding="UTF-8"?>
<!-- Fondo ESTANDAR de RUTA vertical (estilo Pokemon), version detallada.
     Editable: duplica este archivo (p.ej. ruta2.svg) y apunta a el desde
     mapas.js (campo "fondo"). Estilo pixel-art: todo en rejilla de 120x220. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" width="120" height="220"
     shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- ===== PASTO BASE con variacion de tono ===== -->
  <rect x="0" y="0" width="120" height="220" fill="#6fcf5f"/>
  <!-- manchas claras y oscuras para que el cesped no sea plano -->
  <g fill="#7ed96d">
    <rect x="18" y="8" width="10" height="6"/><rect x="92" y="18" width="12" height="6"/>
    <rect x="60" y="40" width="10" height="6"/><rect x="24" y="72" width="12" height="6"/>
    <rect x="86" y="100" width="10" height="6"/><rect x="40" y="132" width="12" height="6"/>
    <rect x="90" y="176" width="10" height="6"/><rect x="26" y="196" width="12" height="6"/>
  </g>
  <g fill="#63c153">
    <rect x="70" y="14" width="8" height="5"/><rect x="30" y="52" width="10" height="5"/>
    <rect x="84" y="78" width="8" height="5"/><rect x="20" y="104" width="10" height="5"/>
    <rect x="92" y="130" width="8" height="5"/><rect x="34" y="166" width="10" height="5"/>
    <rect x="78" y="200" width="8" height="5"/>
  </g>

  <!-- ===== PARCHES DE HIERBA ALTA (donde salen pokemon) ===== -->
  <g fill="#4fae44">
    <rect x="28" y="28" width="18" height="16"/><rect x="74" y="60" width="18" height="16"/>
    <rect x="20" y="118" width="18" height="16"/><rect x="82" y="148" width="18" height="16"/>
    <rect x="46" y="184" width="18" height="16"/>
  </g>
  <!-- briznas verticales sobre la hierba alta -->
  <g fill="#3f9b3a">
    <rect x="31" y="28" width="2" height="7"/><rect x="36" y="30" width="2" height="7"/><rect x="41" y="28" width="2" height="7"/>
    <rect x="77" y="60" width="2" height="7"/><rect x="82" y="62" width="2" height="7"/><rect x="87" y="60" width="2" height="7"/>
    <rect x="23" y="118" width="2" height="7"/><rect x="28" y="120" width="2" height="7"/><rect x="33" y="118" width="2" height="7"/>
    <rect x="85" y="148" width="2" height="7"/><rect x="90" y="150" width="2" height="7"/><rect x="95" y="148" width="2" height="7"/>
    <rect x="49" y="184" width="2" height="7"/><rect x="54" y="186" width="2" height="7"/><rect x="59" y="184" width="2" height="7"/>
  </g>

  <!-- ===== BORDES DE ARBOLES (izquierda y derecha) ===== -->
  <g fill="#2f7d38">
    <rect x="0" y="0" width="16" height="220"/>
    <rect x="104" y="0" width="16" height="220"/>
  </g>
  <!-- copas redondeadas (claro) para dar textura a la linea de arboles -->
  <g fill="#3f9b4a">
    <rect x="2" y="6" width="12" height="10"/><rect x="2" y="40" width="12" height="10"/>
    <rect x="2" y="78" width="12" height="10"/><rect x="2" y="120" width="12" height="10"/>
    <rect x="2" y="158" width="12" height="10"/><rect x="2" y="196" width="12" height="10"/>
    <rect x="106" y="22" width="12" height="10"/><rect x="106" y="60" width="12" height="10"/>
    <rect x="106" y="100" width="12" height="10"/><rect x="106" y="140" width="12" height="10"/>
    <rect x="106" y="180" width="12" height="10"/>
  </g>
  <!-- brillos de copa (muy claro) -->
  <g fill="#5fbf5a">
    <rect x="4" y="8" width="4" height="3"/><rect x="4" y="80" width="4" height="3"/>
    <rect x="4" y="160" width="4" height="3"/>
    <rect x="108" y="24" width="4" height="3"/><rect x="108" y="102" width="4" height="3"/>
    <rect x="108" y="182" width="4" height="3"/>
  </g>
  <!-- troncos sombra (oscuro) en la base de los arboles -->
  <g fill="#245c2b">
    <rect x="0" y="30" width="16" height="4"/><rect x="0" y="108" width="16" height="4"/>
    <rect x="0" y="186" width="16" height="4"/>
    <rect x="104" y="48" width="16" height="4"/><rect x="104" y="128" width="16" height="4"/>
  </g>

  <!-- ===== CAMINO DE TIERRA que serpentea de abajo a arriba ===== -->
  <g fill="#d9b382">
    <rect x="50" y="200" width="20" height="20"/>  <!-- entrada abajo -->
    <rect x="50" y="170" width="20" height="34"/>
    <rect x="30" y="150" width="40" height="22"/>  <!-- curva izq -->
    <rect x="30" y="120" width="20" height="34"/>
    <rect x="30" y="104" width="52" height="20"/>  <!-- curva der -->
    <rect x="62" y="74" width="20" height="34"/>
    <rect x="40" y="56" width="42" height="20"/>   <!-- curva izq -->
    <rect x="40" y="26" width="20" height="34"/>
    <rect x="40" y="10" width="34" height="20"/>   <!-- meta arriba -->
  </g>
  <!-- textura del camino: piedrecitas y sombra -->
  <g fill="#c79e6b" opacity="0.6">
    <rect x="54" y="176" width="3" height="3"/><rect x="62" y="188" width="3" height="3"/>
    <rect x="36" y="156" width="3" height="3"/><rect x="58" y="158" width="3" height="3"/>
    <rect x="34" y="132" width="3" height="3"/><rect x="42" y="110" width="3" height="3"/>
    <rect x="70" y="112" width="3" height="3"/><rect x="66" y="88" width="3" height="3"/>
    <rect x="46" y="64" width="3" height="3"/><rect x="72" y="60" width="3" height="3"/>
    <rect x="44" y="40" width="3" height="3"/><rect x="50" y="16" width="3" height="3"/>
  </g>
  <!-- borde del camino (mas claro) -->
  <g fill="#ecd3a6" opacity="0.5">
    <rect x="50" y="200" width="20" height="3"/>
    <rect x="40" y="10" width="34" height="3"/>
  </g>

  <!-- ===== ESTANQUE (agua) en una esquina ===== -->
  <g>
    <rect x="86" y="30" width="16" height="12" fill="#5db7e8"/>
    <rect x="88" y="32" width="12" height="8" fill="#7fc9f0"/>
    <rect x="90" y="34" width="4" height="2" fill="#bfe6fa"/>
    <rect x="94" y="37" width="4" height="2" fill="#bfe6fa"/>
  </g>

  <!-- ===== FLORES repartidas por el cesped ===== -->
  <!-- rojas -->
  <g>
    <rect x="22" y="48" width="3" height="3" fill="#e84f4f"/><rect x="23" y="49" width="1" height="1" fill="#ffd34f"/>
    <rect x="94" y="118" width="3" height="3" fill="#e84f4f"/><rect x="95" y="119" width="1" height="1" fill="#ffd34f"/>
    <rect x="30" y="92" width="3" height="3" fill="#e84f4f"/><rect x="31" y="93" width="1" height="1" fill="#ffd34f"/>
  </g>
  <!-- amarillas -->
  <g>
    <rect x="86" y="54" width="3" height="3" fill="#ffd34f"/><rect x="87" y="55" width="1" height="1" fill="#fff"/>
    <rect x="24" y="162" width="3" height="3" fill="#ffd34f"/><rect x="25" y="163" width="1" height="1" fill="#fff"/>
    <rect x="90" y="206" width="3" height="3" fill="#ffd34f"/><rect x="91" y="207" width="1" height="1" fill="#fff"/>
  </g>
  <!-- azules -->
  <g>
    <rect x="72" y="128" width="3" height="3" fill="#6b8cff"/><rect x="73" y="129" width="1" height="1" fill="#fff"/>
    <rect x="34" y="208" width="3" height="3" fill="#6b8cff"/><rect x="35" y="209" width="1" height="1" fill="#fff"/>
  </g>

  <!-- ===== ARBUSTOS redondos sueltos ===== -->
  <g>
    <rect x="86" y="88" width="10" height="8" fill="#3f9b4a"/>
    <rect x="88" y="86" width="6" height="2" fill="#4fae44"/>
    <rect x="88" y="90" width="2" height="2" fill="#5fbf5a"/>
  </g>
  <g>
    <rect x="22" y="176" width="10" height="8" fill="#3f9b4a"/>
    <rect x="24" y="174" width="6" height="2" fill="#4fae44"/>
    <rect x="24" y="178" width="2" height="2" fill="#5fbf5a"/>
  </g>

  <!-- ===== ROCAS grises ===== -->
  <g>
    <rect x="78" y="190" width="8" height="6" fill="#9aa0a8"/>
    <rect x="80" y="189" width="4" height="2" fill="#b6bcc4"/>
    <rect x="78" y="194" width="8" height="2" fill="#7a808a"/>
  </g>
  <g>
    <rect x="18" y="86" width="7" height="5" fill="#9aa0a8"/>
    <rect x="19" y="85" width="4" height="2" fill="#b6bcc4"/>
  </g>
</svg>
